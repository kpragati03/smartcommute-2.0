# SmartCommute 2.0 — Backend on Render (Wave 2 production readiness)
# Deploy: Render Dashboard -> New -> Blueprint -> point at this repo,
# or create a Web Service manually with the build/start commands below.
# Secrets are NEVER hardcoded here; set them in the Render dashboard.
services:
  - type: web
    name: smartcommute-backend
    runtime: python
    plan: free
    buildCommand: pip install -r requirements.txt && python manage.py collectstatic --noinput && python manage.py migrate --noinput
    startCommand: gunicorn smartcommute2.wsgi --bind 0.0.0.0:$PORT --workers 2 --timeout 120
    envVars:
      - key: PYTHON_VERSION
        value: "3.12.0"
      - key: SECRET_KEY
        generateValue: true
      - key: DEBUG
        value: "false"
      - key: DATABASE_URL
        fromDatabase:
          name: smartcommute-db
          property: connectionString
      - key: ALLOWED_HOSTS
        value: ".onrender.com"
      - key: CORS_ALLOWED_ORIGINS
        # Replace with the deployed frontend origin(s), comma-separated.
        value: "https://your-frontend.vercel.app"
      - key: FRONTEND_URL
        value: "https://your-frontend.vercel.app"
      - key: EMAIL_BACKEND
        # Console in dev; switch to SMTP in production, e.g.
        # django.core.mail.backends.smtp.EmailBackend + EMAIL_HOST etc.
        value: "django.core.mail.backends.console.EmailBackend"
      - key: TELEMETRY_THROTTLE_RATE
        value: "120/min"

databases:
  - name: smartcommute-db
    plan: free
