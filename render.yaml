# SmartCommute 2.0 — Render Blueprint (backend + managed PostgreSQL)
# Deploy: Render Dashboard -> New -> Blueprint -> point at this repo.
# Secrets are NEVER hardcoded here; Render generates/sets them per below.
services:
  - type: web
    name: smartcommute-backend
    runtime: python
    plan: free
    rootDir: backend
    buildCommand: pip install -r requirements.txt && python manage.py collectstatic --noinput && python manage.py migrate --noinput && python manage.py seed_demo && python manage.py train_eta_model
    startCommand: gunicorn smartcommute2.wsgi --bind 0.0.0.0:$PORT --workers 2 --timeout 120
    envVars:
      - key: PYTHON_VERSION
        value: "3.12.0"
      - key: SECRET_KEY
        generateValue: true
      - key: DEBUG
        value: "false"
      - key: DATABASE_URL
        fromDatabase:
          name: smartcommute-db
          property: connectionString
      - key: ALLOWED_HOSTS
        value: ".onrender.com"
      - key: CORS_ALLOWED_ORIGINS
        # Updated to the deployed Vercel frontend origin after frontend deploy.
        value: "https://smartcommute-2-0.vercel.app"
      - key: FRONTEND_URL
        value: "https://smartcommute-2-0.vercel.app"
      - key: EMAIL_BACKEND
        value: "django.core.mail.backends.console.EmailBackend"
      - key: TELEMETRY_THROTTLE_RATE
        value: "120/min"

databases:
  - name: smartcommute-db
    plan: free
